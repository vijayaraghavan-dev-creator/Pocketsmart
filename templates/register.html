{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<h2>Register</h2>
<form class="panel" method="post" action="/register">
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<label>Username<input name="username" required minlength="3"></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required minlength="6"></label>
<button class="btn">Register</button>
<p class="note">{% if "register" == "login" %}New here? <a href="/register">Create an account</a>{% else %}Already registered? <a href="/login">Login</a>{% endif %}</p>
</form>{% endblock %}
